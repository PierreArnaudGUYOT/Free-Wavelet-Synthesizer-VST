<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 247" width="720" height="247" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Drawbars and tilt</title><desc id="d">Three rows of eleven bars: with a tilt of zero all bands are equal, with minus three and minus six decibels per band the fine bands fall away progressively.</desc><rect width="720" height="247" rx="12" fill="#2a1230"/><text x="14" y="22" font-size="14" fill="#f6f9ff" font-weight="700">The 11 drawbars = the 11 octave bands (all bars up): TILT sets how fast the fine bands fade</text><rect x="14" y="36" width="218" height="118" fill="rgba(255,255,255,0.05)" rx="8" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="24" y="46" width="14.4" height="90" fill="hsl(42,95%,72%)" rx="2" fill-opacity="0.85"/><text x="31.2" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">1</text><rect x="42.4" y="46" width="14.4" height="90" fill="hsl(57,95%,70%)" rx="2" fill-opacity="0.85"/><text x="49.5" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">2</text><rect x="60.7" y="46" width="14.4" height="90" fill="hsl(72,95%,68%)" rx="2" fill-opacity="0.85"/><text x="67.9" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">3</text><rect x="79.1" y="46" width="14.4" height="90" fill="hsl(86,95%,67%)" rx="2" fill-opacity="0.85"/><text x="86.3" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">4</text><rect x="97.5" y="46" width="14.4" height="90" fill="hsl(101,95%,66%)" rx="2" fill-opacity="0.85"/><text x="104.6" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">5</text><rect x="115.8" y="46" width="14.4" height="90" fill="hsl(116,95%,66%)" rx="2" fill-opacity="0.85"/><text x="123" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">6</text><rect x="134.2" y="46" width="14.4" height="90" fill="hsl(131,95%,66%)" rx="2" fill-opacity="0.85"/><text x="141.4" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">7</text><rect x="152.5" y="46" width="14.4" height="90" fill="hsl(146,95%,67%)" rx="2" fill-opacity="0.85"/><text x="159.7" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">8</text><rect x="170.9" y="46" width="14.4" height="90" fill="hsl(160,95%,68%)" rx="2" fill-opacity="0.85"/><text x="178.1" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">9</text><rect x="189.3" y="46" width="14.4" height="90" fill="hsl(175,95%,70%)" rx="2" fill-opacity="0.85"/><text x="196.5" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">10</text><rect x="207.6" y="46" width="14.4" height="90" fill="hsl(190,95%,72%)" rx="2" fill-opacity="0.85"/><text x="214.8" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">11</text><text x="123" y="171" font-size="12" fill="#f6f9ff" text-anchor="middle" font-weight="600">TILT 0 dB per band</text><rect x="246" y="36" width="218" height="118" fill="rgba(255,255,255,0.05)" rx="8" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="256" y="46" width="14.4" height="90" fill="hsl(42,95%,72%)" rx="2" fill-opacity="0.85"/><text x="263.2" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">1</text><rect x="274.4" y="72.3" width="14.4" height="63.7" fill="hsl(57,95%,70%)" rx="2" fill-opacity="0.85"/><text x="281.5" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">2</text><rect x="292.7" y="90.9" width="14.4" height="45.1" fill="hsl(72,95%,68%)" rx="2" fill-opacity="0.85"/><text x="299.9" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">3</text><rect x="311.1" y="104.1" width="14.4" height="31.9" fill="hsl(86,95%,67%)" rx="2" fill-opacity="0.85"/><text x="318.3" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">4</text><rect x="329.5" y="113.4" width="14.4" height="22.6" fill="hsl(101,95%,66%)" rx="2" fill-opacity="0.85"/><text x="336.6" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">5</text><rect x="347.8" y="120" width="14.4" height="16" fill="hsl(116,95%,66%)" rx="2" fill-opacity="0.85"/><text x="355" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">6</text><rect x="366.2" y="124.7" width="14.4" height="11.3" fill="hsl(131,95%,66%)" rx="2" fill-opacity="0.85"/><text x="373.4" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">7</text><rect x="384.5" y="128" width="14.4" height="8" fill="hsl(146,95%,67%)" rx="2" fill-opacity="0.85"/><text x="391.7" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">8</text><rect x="402.9" y="130.3" width="14.4" height="5.7" fill="hsl(160,95%,68%)" rx="2" fill-opacity="0.85"/><text x="410.1" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">9</text><rect x="421.3" y="132" width="14.4" height="4" fill="hsl(175,95%,70%)" rx="2" fill-opacity="0.85"/><text x="428.5" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">10</text><rect x="439.6" y="133.2" width="14.4" height="2.8" fill="hsl(190,95%,72%)" rx="2" fill-opacity="0.85"/><text x="446.8" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">11</text><text x="355" y="171" font-size="12" fill="#f6f9ff" text-anchor="middle" font-weight="600">TILT −3 dB per band</text><rect x="478" y="36" width="218" height="118" fill="rgba(255,255,255,0.05)" rx="8" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><rect x="488" y="46" width="14.4" height="90" fill="hsl(42,95%,72%)" rx="2" fill-opacity="0.85"/><text x="495.2" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">1</text><rect x="506.4" y="90.9" width="14.4" height="45.1" fill="hsl(57,95%,70%)" rx="2" fill-opacity="0.85"/><text x="513.5" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">2</text><rect x="524.7" y="113.4" width="14.4" height="22.6" fill="hsl(72,95%,68%)" rx="2" fill-opacity="0.85"/><text x="531.9" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">3</text><rect x="543.1" y="124.7" width="14.4" height="11.3" fill="hsl(86,95%,67%)" rx="2" fill-opacity="0.85"/><text x="550.3" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">4</text><rect x="561.5" y="130.3" width="14.4" height="5.7" fill="hsl(101,95%,66%)" rx="2" fill-opacity="0.85"/><text x="568.6" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">5</text><rect x="579.8" y="133.2" width="14.4" height="2.8" fill="hsl(116,95%,66%)" rx="2" fill-opacity="0.85"/><text x="587" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">6</text><rect x="598.2" y="134.6" width="14.4" height="1.4" fill="hsl(131,95%,66%)" rx="2" fill-opacity="0.85"/><text x="605.4" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">7</text><rect x="616.5" y="135.3" width="14.4" height="0.7" fill="hsl(146,95%,67%)" rx="2" fill-opacity="0.85"/><text x="623.7" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">8</text><rect x="634.9" y="135.6" width="14.4" height="0.4" fill="hsl(160,95%,68%)" rx="2" fill-opacity="0.85"/><text x="642.1" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">9</text><rect x="653.3" y="135.8" width="14.4" height="0.2" fill="hsl(175,95%,70%)" rx="2" fill-opacity="0.85"/><text x="660.5" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">10</text><rect x="671.6" y="135.9" width="14.4" height="0.1" fill="hsl(190,95%,72%)" rx="2" fill-opacity="0.85"/><text x="678.8" y="148" font-size="9.5" fill="#9a88ab" text-anchor="middle">11</text><text x="587" y="171" font-size="12" fill="#f6f9ff" text-anchor="middle" font-weight="600">TILT −6 dB per band</text><text x="14" y="194" font-size="11.5" fill="#c2d1e6">Band b holds roughly the harmonics 2^(b−2) to 2^(b−1) of the note: band 1 is the fundamental, band 5 the harmonics</text><text x="14" y="209" font-size="11.5" fill="#c2d1e6">8–16, band 11 the harmonics 512–1024. With all bars at 1 and a TILT of −6 dB, each band is half as loud as the one</text><text x="14" y="224" font-size="11.5" fill="#c2d1e6">below.</text></svg>
