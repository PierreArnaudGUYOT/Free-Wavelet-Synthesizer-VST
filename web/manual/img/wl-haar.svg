<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="720" height="294" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Haar transform of eight numbers</title><desc id="d">Eight numbers are cut three times into averages and half-differences, ending with one average and seven details: 1, 2 and 4 details at three sizes. Nothing is lost: the eight numbers can be rebuilt.</desc><rect width="720" height="294" rx="12" fill="#2a1230"/><text x="14" y="22" font-size="14" fill="#f6f9ff" font-weight="700">Haar: the simplest wavelet transform, on eight numbers</text><text x="14" y="57" font-size="12" fill="#c2d1e6">the signal</text><rect x="262" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="285" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">4</text><rect x="315" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="338" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">6</text><rect x="368" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="391" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">10</text><rect x="421" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="444" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">12</text><rect x="474" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="497" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">8</text><rect x="527" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="550" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">6</text><rect x="580" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="603" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">5</text><rect x="633" y="38" width="46" height="28" fill="rgba(255,255,255,0.14)" rx="6" fill-opacity="1"/><text x="656" y="57" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">5</text><text x="14" y="109" font-size="12" fill="#c2d1e6">pairs: average | half-difference</text><rect x="262" y="90" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="285" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">5</text><rect x="315" y="90" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="338" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">11</text><rect x="368" y="90" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="391" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">7</text><rect x="421" y="90" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="444" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">5</text><rect x="488" y="90" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="511" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">−1</text><rect x="541" y="90" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="564" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">−1</text><rect x="594" y="90" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="617" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">1</text><rect x="647" y="90" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="670" y="109" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">0</text><text x="14" y="161" font-size="12" fill="#c2d1e6">again, on the averages</text><rect x="262" y="142" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="285" y="161" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">8</text><rect x="315" y="142" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="338" y="161" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">6</text><rect x="382" y="142" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="405" y="161" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">−3</text><rect x="435" y="142" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="458" y="161" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">1</text><text x="14" y="213" font-size="12" fill="#c2d1e6">and again</text><rect x="262" y="194" width="46" height="28" fill="#ffd166" rx="6" fill-opacity="0.34"/><text x="285" y="213" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">7</text><rect x="329" y="194" width="46" height="28" fill="#7ae7ff" rx="6" fill-opacity="0.3"/><text x="352" y="213" font-size="14" fill="#f6f9ff" text-anchor="middle" font-weight="600">1</text><rect x="14" y="246" width="14" height="10" fill="#ffd166" rx="3" fill-opacity="0.5"/><text x="34" y="255" font-size="11.5" fill="#c2d1e6">average = the broad outline</text><rect x="240" y="246" width="14" height="10" fill="#7ae7ff" rx="3" fill-opacity="0.5"/><text x="260" y="255" font-size="11.5" fill="#c2d1e6">half-difference = the detail that averaging loses</text><text x="14" y="280" font-size="11.5" fill="#f6f9ff">Kept: 7 · 1 · −3 · 1 · −1 · −1 · 1 · 0   (8 numbers in, 8 numbers out: nothing is lost, the signal can be rebuilt)</text></svg>
