<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">The path of the sound through OktoWave</title><desc id="d">Three wavelet oscillators, each with its own envelope, and a sub oscillator go through the oscillator mix and the voice filter of each note, then the velocity; all the notes are then added and share the effects and the limiter.</desc><rect width="720" height="262" rx="12" fill="#2a1230"/><text x="14" y="22" font-size="14" fill="#f6f9ff" font-weight="700">The path of the sound</text><rect x="14" y="36" width="168" height="50" fill="#ffd166" rx="9" stroke="#ffd166" stroke-width="1" fill-opacity="0.22"/><text x="98" y="55" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">A1  ·  A2</text><text x="98" y="70" font-size="10.5" fill="#c2d1e6" text-anchor="middle">wavelets → scale filter → window</text><rect x="14" y="94" width="168" height="50" fill="#7ae7ff" rx="9" stroke="#7ae7ff" stroke-width="1" fill-opacity="0.22"/><text x="98" y="113" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">B1</text><text x="98" y="128" font-size="10.5" fill="#c2d1e6" text-anchor="middle">drawbars → scale filter → window</text><rect x="14" y="152" width="168" height="40" fill="#b9a9c8" rx="9" stroke="#b9a9c8" stroke-width="1" fill-opacity="0.14"/><text x="98" y="171" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">SUB OSC</text><text x="98" y="186" font-size="10.5" fill="#c2d1e6" text-anchor="middle">sine / triangle / square</text><rect x="222" y="66" width="118" height="96" fill="#ff9ec7" rx="9" stroke="#ff9ec7" stroke-width="1" fill-opacity="0.22"/><text x="281" y="85" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">OSC MIX</text><text x="281" y="100" font-size="10.5" fill="#c2d1e6" text-anchor="middle">levels · tuning</text><text x="281" y="112.5" font-size="10.5" fill="#c2d1e6" text-anchor="middle">envelope + pitch env</text><text x="281" y="125" font-size="10.5" fill="#c2d1e6" text-anchor="middle">unison · stereo</text><rect x="372" y="66" width="100" height="96" fill="#b9a9c8" rx="9" stroke="#b9a9c8" stroke-width="1" fill-opacity="0.22"/><text x="422" y="85" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">FILTER</text><text x="422" y="100" font-size="10.5" fill="#c2d1e6" text-anchor="middle">OTA 24 dB</text><text x="422" y="112.5" font-size="10.5" fill="#c2d1e6" text-anchor="middle">own envelope</text><rect x="504" y="66" width="100" height="96" fill="#b9a9c8" rx="9" stroke="#b9a9c8" stroke-width="1" fill-opacity="0.22"/><text x="554" y="85" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">VELOCITY</text><text x="554" y="100" font-size="10.5" fill="#c2d1e6" text-anchor="middle">the key's strength</text><text x="554" y="112.5" font-size="10.5" fill="#c2d1e6" text-anchor="middle">sets the level</text><rect x="222" y="196" width="382" height="44" fill="#ff9ec7" rx="9" stroke="#ff9ec7" stroke-width="1" fill-opacity="0.22"/><text x="413" y="215" font-size="12.5" fill="#f6f9ff" text-anchor="middle" font-weight="700">EFFECTS</text><text x="413" y="230" font-size="10.5" fill="#c2d1e6" text-anchor="middle">saturation → chorus → delay → reverb → master + limiter</text><line x1="182" y1="62" x2="222" y2="98" stroke="#9a88ab" stroke-width="1.5"/><path d="M222 98 l-7 -4 v8 z" fill="#9a88ab"/><line x1="182" y1="119" x2="222" y2="114" stroke="#9a88ab" stroke-width="1.5"/><path d="M222 114 l-7 -4 v8 z" fill="#9a88ab"/><line x1="182" y1="172" x2="222" y2="134" stroke="#9a88ab" stroke-width="1.5"/><path d="M222 134 l-7 -4 v8 z" fill="#9a88ab"/><line x1="340" y1="114" x2="372" y2="114" stroke="#9a88ab" stroke-width="1.5"/><path d="M372 114 l-7 -4 v8 z" fill="#9a88ab"/><line x1="472" y1="114" x2="504" y2="114" stroke="#9a88ab" stroke-width="1.5"/><path d="M504 114 l-7 -4 v8 z" fill="#9a88ab"/><line x1="554" y1="162" x2="554" y2="196" stroke="#9a88ab" stroke-width="1.5"/><path d="M554 196 l-4 -7 h8 z" fill="#9a88ab"/><text x="566" y="184" font-size="10.5" fill="#9a88ab">all the notes added</text><text x="626" y="108" font-size="11" fill="#9a88ab">each note</text><text x="626" y="122" font-size="11" fill="#9a88ab">has its own</text><text x="626" y="136" font-size="11" fill="#9a88ab">path (up to</text><text x="626" y="150" font-size="11" fill="#9a88ab">16 voices)</text></svg>
