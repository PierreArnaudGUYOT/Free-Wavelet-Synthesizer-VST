><text x="20" y="280" font-size="11.5" fill="#5b6573">Key caps show a US/UK QWERTY layout. Physical key positions are used: on AZERTY press</text><text x="20" y="297" font-size="11.5" fill="#5b6573">A Z E R T Y U I O P · Q S D F G H J K L M Ù · W X instead (digits work without Shift).</text><text x="20" y="314" font-size="11.5" fill="#5b6573">“+1” = one octave above the base note (C4 by default; Z / X move it down / up).</text></svg>