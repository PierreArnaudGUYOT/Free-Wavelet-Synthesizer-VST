# The macOS plug-in of OktoWave (Okto MultiWave Synth), built and tested on GitHub's Apple-silicon Macs, for Apple silicon and Intel (version 1.0.6: it has the Crepuscule look and is released with the Windows one).
# Results (Actions tab, "Artifacts"): the release zip and the test output (logs, editor screenshots).
name: macOS plug-in
on:
  workflow_dispatch:   # run by hand (Actions tab > macOS plug-in > Run workflow), on the branch to build
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40   # a menu or a window of the editor left open must not keep the Mac busy
    defaults:
      run:
        shell: bash   # -eo pipefail: a failing test fails the step even through "| tee"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the VST3 bundle (universal)
        run: bash vst/build_mac.sh
      - name: Sound identical to the web engine (Apple silicon)
        run: |
          mkdir -p out/dsp-arm64
          node tools/dsp_compare.js --list out/dsp-arm64
          clang++ -std=c++17 -O2 -ffp-contract=off -arch arm64 -Ivst/src vst/devtest/dsp_render.cpp -o build/mac/dsp_render_arm64
          t0=$(date +%s)
          build/mac/dsp_render_arm64 out/dsp-arm64 > out/dsp-arm64/render.log
          t1=$(date +%s)
          node tools/dsp_compare.js out/dsp-arm64 | tee out/dsp-arm64/compare.log
          # version 1.0.7: the NEON kernels (bandTerms, rampGains, the voice filter) do the scalar code's operations two lanes at a time: the same cases rendered by a build
          # without them (-DWS_NO_NEON) must be the same bytes
          mkdir -p out/dsp-arm64-scalar
          cp out/dsp-arm64/cases.txt out/dsp-arm64-scalar/cases.txt
          clang++ -std=c++17 -O2 -ffp-contract=off -arch arm64 -DWS_NO_NEON -Ivst/src vst/devtest/dsp_render.cpp -o build/mac/dsp_render_arm64_scalar
          t2=$(date +%s)
          build/mac/dsp_render_arm64_scalar out/dsp-arm64-scalar > out/dsp-arm64-scalar/render.log
          t3=$(date +%s)
          echo "render of all the cases: NEON $((t1 - t0)) s, scalar $((t3 - t2)) s" | tee out/dsp-arm64/neon_time.log
          n=0; bad=0
          for f in out/dsp-arm64/*.raw; do n=$((n + 1)); cmp -s "$f" "out/dsp-arm64-scalar/$(basename "$f")" || { echo "DIFFERENT: $f"; bad=$((bad + 1)); }; done
          echo "NEON against scalar: $n files, $bad differ" | tee -a out/dsp-arm64/neon_time.log
          test "$bad" -eq 0
          rm -f out/dsp-arm64/*.raw out/dsp-arm64-scalar/*.raw
      - name: NEON against the scalar code, CPU time (Apple silicon)
        run: |
          mkdir -p out/neon
          node tools/cpu_cases.js out/neon sample 4
          FL="-std=c++17 -O2 -DNDEBUG -ffp-contract=off -arch arm64 -Ivst/src"
          for v in "all:" "band:-DWS_NO_NEON_FILTER -DWS_NO_NEON_REVERB" "filter:-DWS_NO_NEON_BAND -DWS_NO_NEON_REVERB" "reverb:-DWS_NO_NEON_BAND -DWS_NO_NEON_FILTER"; do
            name=${v%%:*}; opts=${v#*:}
            clang++ $FL -DWS_NO_NEON -Dws=ws_old -DAB_MAKE=makeOld -c vst/devtest/cpu_ab_engine.cpp -o build/mac/ab_old.o
            clang++ $FL $opts -Dws=ws_new -DAB_MAKE=makeNew -c vst/devtest/cpu_ab_engine.cpp -o build/mac/ab_new.o
            clang++ -std=c++17 -O2 -arch arm64 vst/devtest/cpu_ab.cpp build/mac/ab_old.o build/mac/ab_new.o -o build/mac/cpu_ab
            build/mac/cpu_ab out/neon/cases_sample.txt --chords 6 --reps 3 --out out/neon/ab_$name.csv
            node tools/cpu_ab_report.js out/neon/ab_$name.csv out/neon/cases_sample.txt "NEON kernels: $name" | head -1 | tee -a out/neon/summary.txt
          done
      - name: Sound identical to the web engine (Intel, Rosetta)
        run: |
          mkdir -p out/dsp-x86_64
          node tools/dsp_compare.js --list out/dsp-x86_64
          clang++ -std=c++17 -O2 -ffp-contract=off -arch x86_64 -Ivst/src vst/devtest/dsp_render.cpp -o build/mac/dsp_render_x86_64
          arch -x86_64 build/mac/dsp_render_x86_64 out/dsp-x86_64 > out/dsp-x86_64/render.log
          node tools/dsp_compare.js out/dsp-x86_64 | tee out/dsp-x86_64/compare.log
          rm -f out/dsp-x86_64/*.raw
      - name: Host test (Apple silicon)
        run: |
          bash tests/machost/build.sh
          mkdir -p out/host-arm64
          build/mac/machost build/mac/OktoMultiWaveSynth.vst3 out/host-arm64 | tee out/host-arm64/machost.log
      - name: Host test (Intel, Rosetta)
        run: |
          mkdir -p out/host-x86_64
          arch -x86_64 build/mac/machost build/mac/OktoMultiWaveSynth.vst3 out/host-x86_64 | tee out/host-x86_64/machost.log
      - name: Release zip
        run: |
          VERSION=$(sed -n 's/^#define WS_VERSION "\([^"]*\)".*/\1/p' vst/src/common.h)
          mkdir -p dist/stage
          ditto build/mac/OktoMultiWaveSynth.vst3 dist/stage/OktoMultiWaveSynth.vst3
          cp vst/INSTALL-mac.txt dist/stage/INSTALL-mac.txt
          ditto -c -k --sequesterRsrc dist/stage "dist/OktoMultiWaveSynth-${VERSION}-mac.zip"
          unzip -l "dist/OktoMultiWaveSynth-${VERSION}-mac.zip" | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: OktoMultiWaveSynth-mac
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-output
          path: out/
