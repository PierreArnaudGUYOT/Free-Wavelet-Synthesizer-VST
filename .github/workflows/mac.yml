# The macOS plug-in (Mac port of the Wavelet Synthesizer beta 0.3; not part of Okto MultiWave Synth beta 0.1, run by hand): built and tested on GitHub's Apple-silicon Macs, for Apple silicon and Intel.
# Results (Actions tab, "Artifacts"): the release zip and the test output (logs, editor screenshots).
name: macOS plug-in
on:
  workflow_dispatch:   # no macOS build is made for beta 0.1 (Windows and web only): run it by hand to try the port
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40   # a menu or a window of the editor left open must not keep the Mac busy
    defaults:
      run:
        shell: bash   # -eo pipefail: a failing test fails the step even through "| tee"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the VST3 bundle (universal)
        run: bash vst/build_mac.sh
      - name: Sound identical to the web engine (Apple silicon)
        run: |
          mkdir -p out/dsp-arm64
          clang++ -std=c++17 -O2 -ffp-contract=off -arch arm64 -Ivst/src vst/devtest/dsp_render.cpp -o build/mac/dsp_render_arm64
          build/mac/dsp_render_arm64 out/dsp-arm64 > out/dsp-arm64/render.log
          node tools/dsp_compare.js out/dsp-arm64 | tee out/dsp-arm64/compare.log
          rm -f out/dsp-arm64/*.raw
      - name: Sound identical to the web engine (Intel, Rosetta)
        run: |
          mkdir -p out/dsp-x86_64
          clang++ -std=c++17 -O2 -ffp-contract=off -arch x86_64 -Ivst/src vst/devtest/dsp_render.cpp -o build/mac/dsp_render_x86_64
          arch -x86_64 build/mac/dsp_render_x86_64 out/dsp-x86_64 > out/dsp-x86_64/render.log
          node tools/dsp_compare.js out/dsp-x86_64 | tee out/dsp-x86_64/compare.log
          rm -f out/dsp-x86_64/*.raw
      - name: Host test (Apple silicon)
        run: |
          bash tests/machost/build.sh
          mkdir -p out/host-arm64
          build/mac/machost build/mac/OktoMultiWaveSynth.vst3 out/host-arm64 | tee out/host-arm64/machost.log
      - name: Host test (Intel, Rosetta)
        run: |
          mkdir -p out/host-x86_64
          arch -x86_64 build/mac/machost build/mac/OktoMultiWaveSynth.vst3 out/host-x86_64 | tee out/host-x86_64/machost.log
      - name: Release zip
        run: |
          VERSION=$(sed -n 's/^#define WS_VERSION "\([^"]*\)".*/\1/p' vst/src/common.h | cut -d. -f1-2)
          mkdir -p dist/stage
          ditto build/mac/OktoMultiWaveSynth.vst3 dist/stage/OktoMultiWaveSynth.vst3
          cp vst/INSTALL-mac.txt dist/stage/INSTALL-mac.txt
          ditto -c -k --sequesterRsrc dist/stage "dist/OktoMultiWaveSynth-beta${VERSION}-mac.zip"
          unzip -l "dist/OktoMultiWaveSynth-beta${VERSION}-mac.zip" | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: OktoMultiWaveSynth-mac
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-output
          path: out/
